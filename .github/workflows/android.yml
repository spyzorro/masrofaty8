name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-final-one-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Detect project folder
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) | sort

          SETTINGS_FILE=$(find . -maxdepth 6 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "No Gradle settings file found in repository files. Trying ZIP files if any exist..."
            mkdir -p "$GITHUB_WORKSPACE/_unzipped_sources"
            ZIP_INDEX=0
            while IFS= read -r ZIP_FILE; do
              ZIP_INDEX=$((ZIP_INDEX + 1))
              DEST="$GITHUB_WORKSPACE/_unzipped_sources/zip_${ZIP_INDEX}"
              mkdir -p "$DEST"
              echo "Extracting $ZIP_FILE"
              unzip -q "$ZIP_FILE" -d "$DEST" || true
              SETTINGS_FILE=$(find "$DEST" -maxdepth 8 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
              if [ -n "$SETTINGS_FILE" ]; then
                break
              fi
            done < <(find . -maxdepth 4 -type f -name "*.zip" | sort)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "No Gradle settings file found."
            echo "Fix: upload the extracted project contents, or upload the full source ZIP file into the repository root."
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected PROJECT_DIR=$PROJECT_DIR"

      - name: Build release APK
        run: |
          gradle -p "$PROJECT_DIR" assembleRelease --no-daemon

      - name: Prepare final single APK
        run: |
          VERSION_NAME=$(grep -E "versionName" "$PROJECT_DIR/app/build.gradle" | head -1 | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/")
          VERSION_CODE=$(grep -E "versionCode" "$PROJECT_DIR/app/build.gradle" | head -1 | sed -E "s/[^0-9]*([0-9]+).*/\1/")
          APK_SOURCE=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name "*.apk" | head -1)

          if [ -z "$APK_SOURCE" ]; then
            echo "APK file was not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/final-apk"
          cp "$APK_SOURCE" "$GITHUB_WORKSPACE/final-apk/Masrofaty-latest.apk"

          APK_COUNT=$(find "$GITHUB_WORKSPACE/final-apk" -name "*.apk" | wc -l | tr -d ' ')
          if [ "$APK_COUNT" != "1" ]; then
            echo "Expected exactly one APK, found $APK_COUNT"
            exit 1
          fi

          cat > "$GITHUB_WORKSPACE/final-apk/update.json" <<EOF
          {
            "latestVersionCode": ${VERSION_CODE},
            "latestVersionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Masrofaty-latest.apk",
            "notes": "نسخة نهائية واحدة تشمل المصروفات والمهام والذهب ومزامنة Google",
            "dataVersion": "2026-08-13",
            "message": "نسخة واحدة كاملة متاحة الآن"
          }
          EOF

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" \
            "final-apk/Masrofaty-latest.apk#Masrofaty-latest.apk" \
            "final-apk/update.json#update.json" \
            --title "Masrofaty v${VERSION_NAME}" \
            --notes "نسخة واحدة كاملة تشمل المصروفات والمهام والذهب ومزامنة Google." \
            --latest \
          || {
            gh release upload "v${VERSION_NAME}" \
              "final-apk/Masrofaty-latest.apk#Masrofaty-latest.apk" \
              "final-apk/update.json#update.json" \
              --clobber
            gh release edit "v${VERSION_NAME}" --latest
          }

      - name: Upload final one APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-Masrofaty-ONE-APK
          path: final-apk/Masrofaty-latest.apk
          if-no-files-found: error
